<div class="add-locations-container">
  <h2>Add Locations</h2>
  <p>This is where you can add new locations for your time conversions.</p>
  <div class="add-form">
    <mat-form-field class="example-form-field">
      <mat-label>Clearable input</mat-label>
      <input matInput type="text" [(ngModel)]="countryName" placeholder="Enter country name">
      @if (countryName) {
        <button matSuffix matIconButton aria-label="Clear" (click)="countryName=''">
          <mat-icon>close</mat-icon>
        </button>
      }
    </mat-form-field>
  </div>
</div>
