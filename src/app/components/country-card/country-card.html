<mat-card appearance="outlined">
  <mat-card-header>
    <mat-card-title-group>
      <mat-card-title>{{ countryObject.countryName }}</mat-card-title>
      <mat-card-subtitle>{{ countryObject.date }}</mat-card-subtitle>
      <img mat-card-sm-image alt="flag" src="{{ getFlagUrl() }}" >
    </mat-card-title-group>
  </mat-card-header>
  <mat-card-content>
    <br/>
    {{ countryObject.time }}
  </mat-card-content>
  <mat-card-actions>
    <mat-checkbox [disabled]="disableReference" (change)="selectedReference($event)">Reference</mat-checkbox>
    <button matButton (click)="onCompare($event)">COMPARE</button>
  </mat-card-actions>
</mat-card>
