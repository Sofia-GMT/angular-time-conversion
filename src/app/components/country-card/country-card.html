<mat-card appearance="outlined">
  <mat-card-header>
    <img mat-card-avatar alt="flag" src="{{ getFlagUrl() }}" >
    <mat-card-title>{{ countryObject.countryName }}</mat-card-title>
  </mat-card-header>
  <mat-card-content/>
  <mat-card-actions>
    <button matButton (click)="onCompare($event)">COMPARE</button>
    <button matButton (click)="onCompare($event)">DELETE</button>
  </mat-card-actions>
</mat-card>
