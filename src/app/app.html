<app-custom-header [appTitle]="title()" (menuClick)="drawer.toggle()"></app-custom-header>
<mat-drawer-container [hasBackdrop]="true">
  <mat-drawer #drawer mode="side">
    <button class="home" matButton routerLink="/home" (click)="drawer.close()">
      <mat-icon>home</mat-icon>
       Home
    </button>
    <mat-divider></mat-divider>
    <mat-divider></mat-divider>
    <button matButton="elevated" extended routerLink="/convert-time" (click)="drawer.close()">
      <mat-icon>access_time</mat-icon>
        Convert Time
    </button>
    <button matButton="elevated" extended routerLink="/add-locations" (click)="drawer.close()">
      <mat-icon>save</mat-icon>
       Add locations
    </button>
  </mat-drawer>

  <div class="example-sidenav-content">
    <router-outlet></router-outlet>
  </div>

</mat-drawer-container>
